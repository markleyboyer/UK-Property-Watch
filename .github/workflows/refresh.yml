name: Refresh property data

on:
  schedule:
    - cron: "17 5 */2 * *"      # every second day, ~05:17 UTC
  workflow_dispatch: {}         # "Run workflow" button in the Actions tab
  push:                         # TEMP-TEST: remove before merge
    branches: [claude/data-pipeline]

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - run: python scripts/refresh.py
      - name: Commit changes
        id: commit
        run: |
          git config user.name "property-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data images
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh property data $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Pushes made with GITHUB_TOKEN don't trigger Pages by themselves, so ask for a build.
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
